name: CD Pipeline
on:
  workflow_run:
    workflows: ["CI Pipline"]
    types:
      - completed
    

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Pull Docker Image
      env:
        DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hello-world:latest
    - name: Delete old Docker Container
      run: sudo docker rm -f hello-world-container || true
    - name: Run Docker Container
      run: sudo docker run -d -p 8080:8080 --name hello-world-container ${{ secrets.DOCKER_USERNAME }}/hello-world
      