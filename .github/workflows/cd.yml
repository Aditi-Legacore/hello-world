name: CD Pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Pull Docker Image
      run: sudo docker pull nandy857/hello-world:latest
    - name: Delete old Docker Container
      run: sudo docker rm -f hello-world-container || true
    - name: Run Docker Container
      run: sudo docker run -d -p 8080:8080 --name hello-world-container nandy857/hello-world