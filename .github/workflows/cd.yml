name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest image
        run: sudo docker pull nandy857/hello-world:latest

      - name: Remove old container
        run: sudo docker rm -f hello-world-container || true

      - name: Start new container
        run: |
          sudo docker run -d \
            -p 8080:8080 \
            --name hello-world-container \
            nandy857/hello-world:latest

      - name: Show running containers
        run: sudo docker ps